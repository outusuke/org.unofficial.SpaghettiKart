app-id: org.unofficial.SpaghettiKart
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: spaghetti-launch

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-download:ro

modules:
  - name: spaghettikart
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/spaghettikart
      - |
        cd src
        APPIMAGE=$(find . -iname '*.appimage' | head -n 1)
        if [ -n "$APPIMAGE" ]; then
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          cp -a squashfs-root/. /app/lib/spaghettikart/
        else
          cp -a . /app/lib/spaghettikart/
        fi
      - find /app/lib/spaghettikart -type f \( -name AppRun -o -iname 'spaghett*' \) ! -name '*.o2r' ! -name '*.yml' ! -name '*.desktop' ! -name '*.png' ! -name '*.svg' -exec chmod +x {} +
      - install -Dm755 spaghetti-launch /app/bin/spaghetti-launch
      - install -Dm644 org.unofficial.SpaghettiKart.desktop -t /app/share/applications
    sources:
      - type: archive
        url: https://github.com/HarbourMasters/SpaghettiKart/releases/download/1.0.0/spaghetti-linux.zip
        sha256: 54e249bd4aa71e55c63239c9c1c0eb522b07497d85f2ede193907059e4de250c
        strip-components: 0
        dest: src
      - type: script
        dest-filename: spaghetti-launch
        commands:
          - D="${XDG_DATA_HOME:-$HOME/.local/share}/spaghettikart-bin"
          - mkdir -p "$D"
          - cp -a /app/lib/spaghettikart/. "$D/"
          - O2R=$(find "$D" -name 'spaghetti.o2r' | head -n 1)
          - if [ -n "$O2R" ]; then cd "$(dirname "$O2R")"; fi
          - if [ -x "$D/AppRun" ]; then exec "$D/AppRun" "$@"; fi
          - exec "$(find "$D" -type f -iname 'spaghettify' | head -n 1)" "$@"
      - type: file
        path: org.unofficial.SpaghettiKart.desktop
